<!DOCTYPE html>

<html class="light" lang="bn"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Medical Clinic Login</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;family=Hind+Siliguri:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#d11010",
                        "secondary": "#1F8A9E",
                        "background-light": "#f8f6f6",
                        "background-dark": "#221010",
                        "surface-light": "#ffffff",
                        "surface-dark": "#2a1515",
                    },
                    fontFamily: {
                        "display": ["Lexend", "Noto Sans", "sans-serif"],
                        "bangla": ["Hind Siliguri", "Noto Sans", "sans-serif"],
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
</head>
<body class="relative flex h-full min-h-screen w-full flex-col bg-background-light dark:bg-background-dark group/design-root overflow-x-hidden font-display text-[#333333] dark:text-[#fcf8f8]">
<!-- Header -->
<div class="flex flex-1 items-center justify-center px-4 py-8 sm:px-6 lg:px-8 relative">
<!-- Background Pattern (Subtle) -->
<div class="absolute inset-0 opacity-5 pointer-events-none" style="background-image: radial-gradient(#d11010 1px, transparent 1px); background-size: 24px 24px;"></div>
<!-- Main Card Container -->
<div class="w-full max-w-[1100px] bg-surface-light dark:bg-surface-dark rounded-xl shadow-xl overflow-hidden flex flex-col lg:flex-row min-h-[600px] z-10 border border-[#f3e7e7] dark:border-[#3a2020]">
<!-- Left Side: Login Form -->
<div class="w-full lg:w-1/2 p-8 lg:p-12 flex flex-col justify-center">
<div class="max-w-md mx-auto w-full">
<!-- Headings -->
<div class="mb-8">
<h1 class="text-primary dark:text-red-500 text-[32px] font-bold leading-tight text-left pb-2 font-bangla">লগইন</h1>
<p class="text-[#6b7280] dark:text-[#9ca3af] text-base font-normal leading-normal font-bangla">আপনার অ্যাকাউন্টে প্রবেশ করতে নিচের তথ্যগুলো দিন</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-6">
<!-- Email Field -->
<div class="flex flex-col gap-2">
<label class="text-[#1b0d0d] dark:text-[#fcf8f8] text-base font-medium leading-normal font-bangla">ইমেইল বা ফোন নম্বর</label>
<input class="form-input flex w-full min-w-0 resize-none overflow-hidden rounded-lg text-[#1b0d0d] dark:text-white placeholder:text-[#9ca3af] dark:placeholder:text-[#6b7280] focus:outline-0 focus:ring-2 focus:ring-primary/20 border border-[#e7cfcf] dark:border-[#5a3a3a] bg-[#fcf8f8] dark:bg-[#1a0a0a] focus:border-primary h-14 p-[15px] text-base font-normal leading-normal transition-colors" placeholder="উদাহরণ: 017..." value=""/>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center">
<label class="text-[#1b0d0d] dark:text-[#fcf8f8] text-base font-medium leading-normal font-bangla">পাসওয়ার্ড</label>
</div>
<input class="form-input flex w-full min-w-0 resize-none overflow-hidden rounded-lg text-[#1b0d0d] dark:text-white placeholder:text-[#9ca3af] dark:placeholder:text-[#6b7280] focus:outline-0 focus:ring-2 focus:ring-primary/20 border border-[#e7cfcf] dark:border-[#5a3a3a] bg-[#fcf8f8] dark:bg-[#1a0a0a] focus:border-primary h-14 p-[15px] text-base font-normal leading-normal transition-colors" placeholder="••••••••" type="password" value=""/>
</div>
<!-- Utility Links -->
<div class="flex items-center justify-between mt-1">
<label class="flex items-center cursor-pointer gap-2 group">
<input class="form-checkbox rounded text-primary border-gray-300 focus:ring-primary h-4 w-4 cursor-pointer" type="checkbox"/>
<span class="text-sm text-[#4b5563] dark:text-[#d1d5db] font-bangla group-hover:text-primary transition-colors">পাসওয়ার্ড মনে রাখুন</span>
</label>
<a class="text-sm font-semibold text-secondary dark:text-[#4fd1e5] hover:underline font-bangla" href="#">পাসওয়ার্ড ভুলে গেছেন?</a>
</div>
<!-- Submit Button -->
<button class="flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-4 bg-primary hover:bg-[#b00d0d] text-[#fcf8f8] text-lg font-bold leading-normal tracking-[0.015em] transition-all shadow-md mt-2 font-bangla">
<span class="truncate">লগইন করুন</span>
</button>
<!-- Register Footer -->
<div class="text-center mt-4">
<p class="text-[#4b5563] dark:text-[#d1d5db] text-base font-normal leading-normal font-bangla">
                                একাউন্ট নেই? 
                                <a class="text-secondary dark:text-[#4fd1e5] font-bold hover:underline ml-1" href="#">নতুন অ্যাকাউন্ট খুলুন</a>
</p>
</div>
</form>
</div>
</div>
<!-- Right Side: Image/Illustration -->
<div class="hidden lg:flex w-1/2 bg-[#fcf8f8] dark:bg-[#1a0a0a] relative overflow-hidden group">
<div class="absolute inset-0 bg-center bg-no-repeat bg-cover transition-transform duration-700 group-hover:scale-105" data-alt="A friendly female doctor smiling reassuringly in a clean, modern clinic setting" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuDMXuHhv8PqhRiGzaHV5AKSaGVubIbOiIQt03HjA-RKsnH6_P2pVeJ4kptehdbmaly3YYk-WrNADCxGdRObggaBlH0j0GuBKhiuHGNGWSarlmJ5oJo3Vv0CKrCcq1Y9Nxk0Q8PjZL3rLeCWKUO-KNTEOMoNFigTQU23Bjz0ZkPRz7bw49jDfagQUUCFwcHcWMYH2GdZ7JozYL9s1nzchSW3f6tDgyHxyk5A-QY-muPDWx56AA54QqrwyZXi-kV58sJSSBmbyZD1cM0");'>
</div>
<!-- Overlay Gradient -->
<div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent flex flex-col justify-end p-12">
<div class="transform translate-y-0 transition-transform duration-500">
<div class="flex items-center gap-2 mb-3 text-white/90">
<span class="material-symbols-outlined text-2xl">verified_user</span>
<span class="text-sm font-bold uppercase tracking-wider font-display">Trusted Healthcare</span>
</div>
<h3 class="text-white text-3xl font-bold mb-3 font-bangla leading-tight">আপনার এবং আপনার পরিবারের সুস্বাস্থ্যের নিশ্চয়তা</h3>
<p class="text-white/80 text-lg font-bangla max-w-md">২৪/৭ বিশেষজ্ঞ ডাক্তারদের পরামর্শ নিন ঘরে বসেই।</p>
</div>
</div>
</div>
</div>
</div>
</body></html>
